# {{name}}: the skill pack declares itself once, here. The vendored kit
# (scripts/kit/) reads every name it needs from this file and hard-codes none.
# A change here can move the write path or what a release ships, so it is on
# the risky list (CODEOWNERS).

[skill_pack]
name = "{{name}}"                # the repository and skill name
cli = "{{cli}}"                  # the CLI word in docs and in every `next` command
env_prefix = "{{env_prefix}}"    # {{env_prefix}}_DATA_DIR, {{env_prefix}}_CONFIRM_CODE_SECRET, {{env_prefix}}_ALLOW_WRITES, {{env_prefix}}_KILL …
db_file = "{{cli}}.db"           # the database, under {{env_prefix}}_DATA_DIR
scripts_dir = "scripts"          # on sys.path; the skill pack's own library is scripts/_lib
languages = ["en", "zh"]         # every message code row has one meaning_<lang> per language; en, zh-Hans, zh-Hant: docs/languages.md
markets = []                     # the closed set of scopes, for example ["HK", "TW"]; [] = no scope partition
home_env_file = ""               # an optional env file in the home folder, for example "~/.{{cli}}.env"; "" = none

[kit]
# The kit packs this skill pack vendors (the playbook's kit/packs.tsv) besides base and
# testkit, which it always takes: "compliance" (ad copy), "generation" (paid AI
# generation, real people), "data" (rate-limited pulls). Re-vendor after a change.
packs = []

[ssot]
dir = "ssot"
message_codes = "ssot/message_codes.tsv"
fact_keys = "ssot/fact_keys.tsv"
decision_keys = "ssot/decision_keys.tsv"
constants = "ssot/constants.tsv"
story_checks = "ssot/story_checks.tsv"

[release]
# A release is `git archive` of its tag. These stay out of it (export-ignore) ...
internal = ["CLAUDE.md", "tests", "evals", "docs", ".gitlab-ci.yml", ".gitlab", ".claude", "ssot/README.md"]
# ... and these must be in it. The vendored kit and console always ship.
must_ship = ["SKILL.md", "README.md", "skill-pack.toml", "scripts/{{cli}}.py"]

[layers]
# Read by the layering test: pull never imports the database, ingest never an
# API client, compute neither a client nor the writer, and only the modules in
# writer_importers import the writer.
pull = "pull_*"
ingest = "ingest_*"
compute = "compute_*"
writer = "_lib/writer"                 # the only module that may call the external write API
writer_importers = ["execute_actions"]
clients = []                           # API client modules, for example ["_lib/api_client"]; they never import the database
spawn_allowed = ["compute_stories"]    # the one compute that may run other read verbs

# Optional, read by kit/env.py: the skill pack's own variables no env file may set
# (only the process env), besides the kit's (gate secrets, KIT_TTY, the binding,
# loader variables); doctor names such a line in a .env.
# [env]
# never_from_file = ["{{env_prefix}}_TEST_SEAM"]

# Optional, read by tests/test_clock.py: the code it lints defaults to the
# scripts dir, minus the vendored kit. A skill pack that adopts the kit late lists
# the calendar reads it has not moved to kit.dates yet, as "path::function" =
# count; the list must match exactly and only shrinks. A new skill pack has none.
# [guards.clock.allowed]
# "scripts/pull_ads.py::window" = 1

# Optional, read by kit.guards.roadmap (tests/test_roadmap.py): where the roadmap
# lives when it is not docs/ROADMAP.md or ROADMAP.md.
# [guards.roadmap]
# file = "docs/ROADMAP.md"

# Optional, read by kit.guards.pages (a test adds suites.page_links(ROOT)): no shipped file links to a
# hosted artifact. `hosts`: more hosts to treat so; `allow`: a shipped file that may hold one, with its
# reason (or {reason, max}: at most `max` lines). docs/rules.md, "A page the skill pack delivers is drawn by the skill pack".
# [guards.pages]
# hosts = ["pages.example.test/view"]
# [guards.pages.allow]
# "docs/page-rules.md" = "the doc that names the rule"

# Optional, read by the leak guard (scripts/kit/tools/leak_guard.py, the pre-push hook):
# the client-term lists, outside this repository, as paths or globs ("~" expands; a
# relative one is from the top level, which a worktree moves). None found = push refused.
# [guards.leak]
# terms = ["~/work/workspaces/{{name}}/*/data/client_terms.txt"]

# Read by kit.guards.evals. `extra`: the verbs only a person runs besides the gated
# ones (an external write such as `execute apply` is one; an external read, a pull,
# is the agent's); SKILL.md's Never table names each (tests/test_never_table.py),
# and an eval agent must never run them either. The rest is optional (templates/evals/README.md):
# whole families an eval agent must not run, and the SKILL.md rules that have no
# case yet (a list that only shrinks).
[guards.evals]
extra = ["facts init", "execute apply"]
# families = ["queue"]
# uncovered = []
